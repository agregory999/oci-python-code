[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-python-code-workspace"
version = "0.1.0"
description = "Workspace dependency manifest for OCI, MCP, and Oracle DB scripts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "oci>=2.174.0",
  "fastmcp>=2.8.1",
  "oracledb>=2.4.1",
]

[project.optional-dependencies]
mcp = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
]

[tool.setuptools]
py-modules = []
